# FileDownloader config
# Folder penyimpanan relatif terhadap plugins/FileDownloader/
download-folder: "downloads"

# Batas ukuran file (MB). 0 = tanpa batas (tidak disarankan).
max-file-size-mb: 100

# Timeout koneksi & baca (detik)
timeout-seconds: 30

# User-Agent saat download
user-agent: "FileDownloader/1.0 (PaperMC)"

# Timpa file kalau nama sudah ada? false = tolak, true = timpa
overwrite-existing: false

# Blokir download ke IP private/localhost (anti-SSRF). Disarankan true.
block-private-addresses: true

# Kirim progress tiap N persen (minimal 5)
progress-step-percent: 10

# --- FTP / FTPS ---
# Kredensial diambil dari URL, contoh:
#   ftp://user:pass@host:21/path/file.zip
#   ftps://user:pass@host:21/path/file.zip
# Tanpa user di URL dipakai login anonymous.

# --- SFTP ---
# Contoh: sftp://user:pass@host:22/path/file.zip
# Kalau password tidak ada di URL, dipakai private key di bawah ini.
# Path relatif terhadap plugins/FileDownloader/ atau absolut.
sftp-private-key: ""
sftp-passphrase: ""
# Verifikasi host key server. false = terima semua (mudah, kurang aman).
# true = cek known_hosts di bawah (disarankan untuk server produksi).
sftp-strict-host-key-checking: false
sftp-known-hosts: ""
